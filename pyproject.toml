[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colour-unblind"
version = "0.1.0"
description = "Recolour or simulate video for colour-blind people and cats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "daltonlens==0.1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
colour-unblind = "colour_unblind.cli:main"

[tool.setuptools]
packages = ["colour_unblind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
